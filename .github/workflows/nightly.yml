name: Oakhaven nightly

on:
  schedule:
    - cron: "7 5 * * *"        # 05:07 UTC = 11:07 pm Central in winter, 12:07 am in summer
  workflow_dispatch:            # the "Run workflow" button on the Actions tab
    inputs:
      dry_run:
        description: "Dry run: show what would happen, change nothing"
        type: boolean
        default: false
  push:
    branches: [main]            # any edit you make on GitHub goes live too

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oakhaven
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Advance one day
        run: python nightly.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      - name: Save the new day
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "oakhaven-bot"
          git config user.email "oakhaven-bot@users.noreply.github.com"
          git add data.json report.md
          git diff --cached --quiet || git commit -m "Day $(python -c 'import json; print(json.load(open("data.json"))["day"])')"
          git push
      - name: Invite card and camera-roll profile for anyone new
        continue-on-error: true            # a card that fails to draw never holds up the day
        run: |
          OUT=${{ inputs.dry_run && '/tmp/cards' || 'cards' }}
          CARDS=0; python studio/invite_card.py need "$OUT" && CARDS=1
          BIBLE=0; python studio/bible_sync.py need && BIBLE=1
          if [ "$CARDS$BIBLE" != 00 ]; then
            pip install playwright && python -m playwright install --with-deps chromium
            python -m http.server 8768 >/dev/null 2>&1 &
            sleep 2
            [ $CARDS = 1 ] && python studio/invite_card.py missing "$OUT"
            [ $BIBLE = 1 ] && python studio/bible_sync.py missing
            if [ "$OUT" = cards ]; then
              git add cards photos/bible.json
              git diff --cached --quiet || git commit -m "Invite cards and photo profiles, day $(python -c 'import json; print(json.load(open("data.json"))["day"])')"
              git push
            fi
          fi

  deploy:
    needs: update
    if: ${{ always() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
